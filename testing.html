<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyPetakom – Login</title>

  
  <link rel="stylesheet" href="login.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>

  <section class="left">
    <div class="logo-box">
      <img src="pic/pentakom.png" alt="MyPetakom Logo">
    </div>
  </section>

  <section class="right">
    <div class="card">

      <h1>Welcome to MyPetakom!</h1>
      <p class="subtitle">Please login to continue</p>

      <form>

       
        <div class="form-group">
          <label>Username</label>
          <input type="text" placeholder="example: aliabu_57" required>
        </div>

      
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>

        <div class="form-group">
          <label>Select role</label>
          <select required>
            <option value="" disabled selected>Choose your role</option>
            <option value="student">Student</option>
            <option value="staff">Safety Staff</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        
        <button class="btn-primary" type="submit">Login</button>

        
        <div class="signup">
          Do not have an account yet? <a href="#">Sign Up</a>
        </div>

      </form>

    </div>
  </section>

  
  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      const btn = document.querySelector(".password-toggle");
      const hidden = input.type === "password";

      input.type = hidden ? "text" : "password";
      btn.textContent = hidden ? "Hide" : "Show";
    }
  </script>

</body>
</html>
