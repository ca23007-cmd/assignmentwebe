<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UMP X PETAKOM - Booking</title>
    <link rel="stylesheet" href="bookingform.css">
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">
            LOGO UMP X<br>PETAKOM
        </div>

        <div class="nav-links">
            <span>Dashboard</span>
            <span>Membership</span>
            <span>Booking Parking</span>
            <span>Parking Summon</span>
        </div>

        <div class="logout">
            <br>LOG OUT
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="page-label">
            <br>Booking Form
        </div>

        <div class="booking-box">
            <div class="booking-title">
                <br>
Booking Form
            </div>

            <form class="booking-form">
                <input type="text" placeholder="Parking Space ID">
                <input type="date">
                <input type="time">
                <input type="text" placeholder="Expected Duration">
                <input type="text" placeholder="Car Plate Number">

                <div class="button-group">
                    <button type="button">Check Availability</button>
                    <button type="submit">Confirm</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
